# Conexão do External Secrets Operator com o OpenBao, usada por todos os
# ExternalSecret dos serviços.
#
# Autenticação "kubernetes": o ESO apresenta o token da própria Service
# Account (external-secrets/external-secrets) e o OpenBao, pela role
# "external-secrets", devolve um token com a policy togglemaster-read
# (só leitura em secret/togglemaster/*). Nenhuma senha aqui.
#
# Criados por toggle-master-infra/scripts/openbao-bootstrap.sh: o KV v2
# em secret/, a auth kubernetes, a policy e a role.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
