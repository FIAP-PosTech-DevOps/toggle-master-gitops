# Projeto ArgoCD do ToggleMaster em production: limita de onde as Applications
# podem ler (só este repositório) e onde podem escrever (os namespaces dos
# serviços e o do External Secrets, destino da Application "platform").
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: togglemaster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: ToggleMaster (production)
  sourceRepos:
    - https://github.com/FIAP-PosTech-DevOps/toggle-master-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: auth-service
    - server: https://kubernetes.default.svc
      namespace: flag-service
    - server: https://kubernetes.default.svc
      namespace: targeting-service
    - server: https://kubernetes.default.svc
      namespace: evaluation-service
    - server: https://kubernetes.default.svc
      namespace: analytics-service
    - server: https://kubernetes.default.svc
      namespace: external-secrets
  # Recursos de escopo de cluster que as Applications podem criar.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: external-secrets.io
      kind: ClusterSecretStore

  # Janela de deploy de produção: o ArgoCD só sincroniza os serviços em dias
  # úteis, das 10h às 18h (horário de Brasília). Fora dela, uma tag nova fica
  # "OutOfSync" esperando a janela abrir.
  #
  # manualSync: true deixa um humano forçar o sync fora da janela (hotfix).
  syncWindows:
    - kind: allow
      schedule: "0 10 * * 1-5"
      duration: 8h
      timeZone: America/Sao_Paulo
      manualSync: true
      applications:
        - auth-service
        - flag-service
        - targeting-service
        - evaluation-service
        - analytics-service
