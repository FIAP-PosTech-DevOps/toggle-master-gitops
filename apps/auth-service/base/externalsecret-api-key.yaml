# A migração do auth-service precisa da SERVICE_API_KEY do
# evaluation-service para registrar o hash dela na tabela api_keys.
# O Secret fica no namespace do auth-service e só o Job o monta.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: evaluation-service-api-key
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: evaluation-service-api-key
    creationPolicy: Owner
  data:
    - secretKey: SERVICE_API_KEY
      remoteRef:
        key: togglemaster/evaluation-service
        property: SERVICE_API_KEY
