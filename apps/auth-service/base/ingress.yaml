# Rotas públicas do auth-service no ingress-nginx (NLB). Cada serviço declara
# as suas no próprio namespace; o ingress-nginx junta todas no mesmo host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-service
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /validate
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  name: http
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  name: http
