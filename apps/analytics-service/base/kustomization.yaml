# Base do analytics-service: o que é igual em develop, staging e production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: analytics-service

labels:
  - pairs:
      app.kubernetes.io/part-of: togglemaster
      app.kubernetes.io/name: analytics-service
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - keda.yaml

configMapGenerator:
  # Configuração não sensível comum aos 3 ambientes. O que muda por ambiente
  # (região, fila) entra no overlay com behavior: merge.
  - name: analytics-service-config
    literals:
      - AWS_DYNAMODB_TABLE=ToggleMasterAnalytics
