# analytics-service em develop (us-east-2).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# A linha newTag é a "versão implantada" deste serviço neste ambiente.
# Quem altera: a CI do analytics-service (push em release/* -> develop; botões de
# promoção -> staging e production). Rollback = git revert do commit que a
# alterou.
images:
  - name: analytics-service
    newName: 413816840261.dkr.ecr.us-east-1.amazonaws.com/togglemaster/analytics-service
    newTag: v0.0.0

configMapGenerator:
  - name: analytics-service-config
    behavior: merge
    literals:
      - AWS_REGION=us-east-2
      - AWS_SQS_URL=https://sqs.us-east-2.amazonaws.com/413816840261/togglemaster-develop-queue

patches:
  # IRSA: role deste ambiente (criada pelo Terraform, módulo workload-identity).
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: analytics-service-sa
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::413816840261:role/togglemaster-develop-irsa-analytics
  # Fila e região deste ambiente para o gatilho do KEDA.
  - target:
      group: keda.sh
      kind: ScaledObject
      name: analytics-service
    patch: |-
      - op: replace
        path: /spec/triggers/0/metadata/queueURL
        value: https://sqs.us-east-2.amazonaws.com/413816840261/togglemaster-develop-queue
      - op: replace
        path: /spec/triggers/0/metadata/awsRegion
        value: us-east-2
