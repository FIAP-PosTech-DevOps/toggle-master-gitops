# analytics-service em production (us-east-1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# A linha newTag é a "versão implantada" deste serviço neste ambiente.
# Quem altera: a CI do analytics-service, no merge do PR release/vX.Y.Z -> main,
# depois da aprovação. É a mesma imagem que está em staging, sem novo build.
# Rollback = git revert do commit que a alterou.
images:
  - name: analytics-service
    newName: 413816840261.dkr.ecr.us-east-1.amazonaws.com/togglemaster/analytics-service
    newTag: v0.0.0

configMapGenerator:
  - name: analytics-service-config
    behavior: merge
    literals:
      - AWS_REGION=us-east-1
      - AWS_SQS_URL=https://sqs.us-east-1.amazonaws.com/413816840261/togglemaster-production-queue

patches:
  # IRSA: role deste ambiente (criada pelo Terraform, módulo workload-identity).
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: analytics-service-sa
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::413816840261:role/togglemaster-production-irsa-analytics
  # Fila e região deste ambiente para o gatilho do KEDA.
  - target:
      group: keda.sh
      kind: ScaledObject
      name: analytics-service
    patch: |-
      - op: replace
        path: /spec/triggers/0/metadata/queueURL
        value: https://sqs.us-east-1.amazonaws.com/413816840261/togglemaster-production-queue
      - op: replace
        path: /spec/triggers/0/metadata/awsRegion
        value: us-east-1
  # Redundância em 2 AZs: as réplicas se espalham pelas zonas (no máximo 1 de
  # diferença entre elas). Se uma AZ cair, a outra continua atendendo.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: analytics-service
      spec:
        template:
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    app: analytics-service
