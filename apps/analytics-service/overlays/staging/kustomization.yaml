# analytics-service em staging (us-east-1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# A linha newTag é a "versão implantada" deste serviço neste ambiente.
# Quem altera: a CI do analytics-service, a cada push em release/vX.Y.Z
# (imagem vX.Y.Z-<sha>).
# Rollback = git revert do commit que a alterou.
images:
  - name: analytics-service
    newName: 413816840261.dkr.ecr.us-east-1.amazonaws.com/togglemaster/analytics-service
    newTag: v0.0.0

configMapGenerator:
  - name: analytics-service-config
    behavior: merge
    literals:
      - AWS_REGION=us-east-1
      - AWS_SQS_URL=https://sqs.us-east-1.amazonaws.com/413816840261/togglemaster-staging-queue
      # staging e production dividem a região: a tabela de staging tem sufixo.
      - AWS_DYNAMODB_TABLE=ToggleMasterAnalytics-staging

patches:
  # IRSA: role deste ambiente (criada pelo Terraform, módulo workload-identity).
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: analytics-service-sa
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::413816840261:role/togglemaster-staging-irsa-analytics
  # Fila e região deste ambiente para o gatilho do KEDA.
  - target:
      group: keda.sh
      kind: ScaledObject
      name: analytics-service
    patch: |-
      - op: replace
        path: /spec/triggers/0/metadata/queueURL
        value: https://sqs.us-east-1.amazonaws.com/413816840261/togglemaster-staging-queue
      - op: replace
        path: /spec/triggers/0/metadata/awsRegion
        value: us-east-1
