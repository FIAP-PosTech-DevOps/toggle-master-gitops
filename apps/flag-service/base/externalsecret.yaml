# O valor NÃO está no Git: este objeto só diz "crie o Secret flag-service-secret
# com as chaves que estão em secret/togglemaster/flag-service no OpenBao".
# Quem busca e mantém o Secret atualizado é o External Secrets Operator.
#
# Conteúdo: DATABASE_URL (gravados por
# toggle-master-infra/scripts/openbao-bootstrap.sh).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flag-service-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: flag-service-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: togglemaster/flag-service
