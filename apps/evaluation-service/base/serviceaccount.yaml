# Service Account com IRSA: a annotation eks.amazonaws.com/role-arn (posta
# por ambiente, em overlays/<ambiente>) faz o EKS injetar no pod um token
# que troca por credenciais temporárias da role
# togglemaster-<ambiente>-irsa-evaluation. Nenhuma chave de acesso no pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation-service-sa
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
