# HPA por CPU no evaluation-service — o caminho quente de alta performance.
# Request de CPU 100m + alvo 70% = nova réplica quando o uso médio passa
# de ~70m por pod. Requer o metrics-server (cluster-addons).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: evaluation-service
  # Onda 2, depois do Deployment (onda 1). Na onda padrão (0) o ArgoCD
  # espera este recurso ficar saudável antes de criar o Deployment, mas ele
  # só fica saudável quando o Deployment existe: o sync trava para sempre.
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evaluation-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120
