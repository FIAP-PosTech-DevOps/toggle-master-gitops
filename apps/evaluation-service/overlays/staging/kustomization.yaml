# evaluation-service em staging (us-west-2).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# A linha newTag é a "versão implantada" deste serviço neste ambiente.
# Quem altera: a CI do evaluation-service (push em release/* -> develop; botões de
# promoção -> staging e production). Rollback = git revert do commit que a
# alterou.
images:
  - name: evaluation-service
    newName: 413816840261.dkr.ecr.us-east-1.amazonaws.com/togglemaster/evaluation-service
    newTag: v0.0.0

configMapGenerator:
  - name: evaluation-service-config
    behavior: merge
    literals:
      - AWS_REGION=us-west-2
      - AWS_SQS_URL=https://sqs.us-west-2.amazonaws.com/413816840261/togglemaster-staging-queue

patches:
  # IRSA: role deste ambiente (criada pelo Terraform, módulo workload-identity).
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: evaluation-service-sa
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::413816840261:role/togglemaster-staging-irsa-evaluation
