# targeting-service em production (us-east-1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# A linha newTag é a "versão implantada" deste serviço neste ambiente.
# Quem altera: a CI do targeting-service, no merge do PR release/vX.Y.Z -> main,
# depois da aprovação. É a mesma imagem que está em staging, sem novo build.
# Rollback = git revert do commit que a alterou.
images:
  - name: targeting-service
    newName: 413816840261.dkr.ecr.us-east-1.amazonaws.com/togglemaster/targeting-service
    newTag: v0.0.0

patches:
  # Produção com 2 réplicas: um pod pode cair (deploy, nó) sem indisponibilidade.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: targeting-service
      spec:
        replicas: 2
  # Redundância em 2 AZs: as réplicas se espalham pelas zonas (no máximo 1 de
  # diferença entre elas). Se uma AZ cair, a outra continua atendendo.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: targeting-service
      spec:
        template:
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    app: targeting-service
